<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Scraper Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">

<body class="app-body">
    <main class="page-shell">
        <section class="hero">
            <h1>Social Media Scraper Hub</h1>
            <p>Pilih platform untuk mulai pencarian akun di komentar atau reply.</p>
        </section>

        <section class="glass-card">
            <div class="platform-grid">
                <a class="platform-link instagram" href="/instagram"><i class="bi bi-instagram"></i> Instagram</a>
                <a class="platform-link tiktok" href="/tiktok"><i class="bi bi-tiktok"></i> TikTok</a>
                <a class="platform-link facebook" href="/facebook"><i class="bi bi-facebook"></i> Facebook</a>
                <a class="platform-link youtube" href="/youtube"><i class="bi bi-youtube"></i> YouTube</a>
                <a class="platform-link x" href="/twitter"><i class="bi bi-twitter-x"></i> X (Twitter)</a>
            </div>
        </section>
    </main>
    </div>
